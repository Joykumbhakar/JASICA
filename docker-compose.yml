version: "3.8"

services:
  jasica-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jasica_controller_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
